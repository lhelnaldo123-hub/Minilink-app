.pc{color:#282828;border:0;box-shadow:0 4px 16px rgba(80,40,0,.09);border-radius:16px}.pc img{object-fit:cover}.pc .b{gap:4px}.pc .nm{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}.pp{font-size:19px}
body.light .chip{background:#fff;box-shadow:0 2px 8px rgba(80,40,0,.05)}body.light .chip.on{background:var(--ac)}
.addb{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:#282828;color:#fff;font-size:21px;z-index:2}

#cnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #f1e2d0;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 20px rgba(80,40,0,.06)}

<script>
/* ===== 1. PASTE YOUR FIREBASE CONFIG HERE ===== */
const FIREBASE_CONFIG={
 apiKey:"AIzaSyA1Oh8G27fvnorrVd3kWOzhtl9mWVTvBFk",authDomain:"minilink-web.firebaseapp.com",projectId:"minilink-web",
 storageBucket:"minilink-web.firebasestorage.app",messagingSenderId:"823250830184",appId:"1:823250830184:web:c0510c4a65b0664976ccdd"};
const SUPPORT_EMAIL="lhelnaldo123@gmail.com", FREE_LIMIT=10, APP_NAME="Mini-Store Link";
/* ============================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3600)}
function view(id){document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id===id));$('#tabs').style.display=id==='dash'?'flex':'none';$('#cnav').style.display=id==='pub'?'flex':'none';document.body.classList.toggle('light',id==='pub'||id==='shops');window.scrollTo(0,0)}

function compress(file,max,q=.72){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=u})}

const RESERVED=['','index.html','terms','privacy','app','shops','404.html'];
function slugFromUrl(){const q=new URLSearchParams(location.search).get('s');if(q)return q.toLowerCase();if(location.hostname.endsWith('github.io'))return '';const p=location.pathname.split('/')[1]||'';return RESERVED.includes(p.toLowerCase())?'':p.toLowerCase()}
let authReady=false,user=null;
function route(){
 if(location.hash==='#terms'||location.hash==='#privacy'){legal(location.hash.slice(1));return}
 if(location.hash==='#shops'){loadShops();return}
 const slug=slugFromUrl();
 if(slug){loadPublic(slug);return}
 if(!authReady)return;
 user?loadDash():view('auth')}

auth.onAuthStateChanged(u=>{user=u;authReady=true;route();hideSplash()});
function hideSplash(){setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash')?.remove(),600)},900)}

function draw(){if(!SHOP||!$('#dash').classList.contains('on'))return;({prod:dProd,ord:dOrd,stats:dStats,promo:dPromo,shop:dShop,share:dShare})[T]()}
const shopUrl=id=>location.hostname.endsWith('github.io')?location.origin+location.pathname.replace(/[^/]*$/,'')+'?s='+id:location.origin+'/'+id;
const link=()=>shopUrl(SHOP.id);

function setupForm(){$('#tabs').style.display='none';$('#dName').textContent='Welcome';
 $('#dBody').innerHTML=`<div class="card"><h3>Create your shop</h3><p class="mut">This takes one minute.</p>
 <label>Shop name</label><input id="sN" placeholder="e.g. Ama's Thrift">
 <label>Shop link (letters and numbers only)</label><input id="sS" placeholder="amathrift" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9]/g,'')">
 <label>WhatsApp number (with country code)</label><input id="sW" type="tel" placeholder="233241234567">
 <label>About your shop</label><textarea id="sA" rows="2" placeholder="What do you sell? Where are you?"></textarea>
 <button class="btn" onclick="createShop()">Create my shop</button></div>`}
async function createShop(){const name=$('#sN').value.trim(),slug=$('#sS').value.trim(),wa=$('#sW').value.replace(/\D/g,'');
 if(!name||slug.length<3||wa.length<9)return toast('Fill name, a link of 3+ letters, and your WhatsApp number');
 if(RESERVED.includes(slug))return toast('That link is reserved. Try another.');
 try{const r=db.collection('shops').doc(slug);if((await r.get()).exists)return toast('That link is taken. Try another.');
  await r.set({owner:user.uid,name,whatsapp:waNum(wa),about:$('#sA').value.trim(),color:'#f68b1e',logo:'',listed:true,visits:0,premium:false,cod:true,created:Date.now()});
  toast('Shop created 🎉');loadDash()}catch(e){toast('Could not create shop. Check Firestore rules.')}}

function dProd(){
 $('#dBody').innerHTML=`<div class="stats"><div><b>${MP.length}</b>Products</div><div><b>${SHOP.visits||0}</b>Visits</div><div><b>${MO.length}</b>Orders</div><div><b>${money(MO.filter(o=>o.status==='done').reduce((a,o)=>a+(+o.total||0),0))}</b>Sales (done)</div></div>
 <button class="btn" onclick="prodForm()">+ Add product</button>
 ${!SHOP.premium?`<p class="mut" style="margin:8px 0">Free plan: ${MP.length}/${FREE_LIMIT} products</p>`:''}
 ${MP.length?MP.map(p=>`<div class="pr">${p.img?`<img src="${p.img}">`:'<div class="ph">🛍️</div>'}<div class="i" onclick="prodForm('${p.id}')"><b>${esc(p.name)}</b><span class="mut">${money(p.price)} ${p.cat?'· '+esc(p.cat):''}</span><span class="mut" style="display:block;${p.qty===0?'color:#ff9a8a':''}">📦 ${p.qty==null?'No limit set':p.qty+' in stock'}</span></div><div class="tg ${p.stock!==false?'on':''}" onclick="stock('${p.id}',${p.stock!==false})"></div></div>`).join(''):'<div class="card mut" style="text-align:center">No products yet. Add your first one.</div>'}`}
function stock(id,cur){db.collection('shops').doc(SHOP.id).collection('products').doc(id).update({stock:!cur});toast(cur?'Marked sold out':'Back in stock')}
let IMG='',EX=[];
function thumbs(){const t=(src,fn)=>`<div class="th"><img src="${src}"><button onclick="${fn}">×</button></div>`;
 $('#pv').innerHTML=IMG?t(IMG,"IMG='';thumbs()"):`<label class="th">＋<input type="file" accept="image/*" hidden onchange="pickImg(this,0)"></label>`;
 $('#pe').innerHTML=EX.map((s,i)=>t(s,`EX.splice(${i},1);thumbs()`)).join('')+(EX.length<5?`<label class="th">＋<input type="file" accept="image/*" multiple hidden onchange="pickImg(this,1)"></label>`:'')}
async function pickImg(i,more){const fs=[...i.files];for(const f of(more?fs:fs.slice(0,1))){try{const d=await compress(f,more?640:720,.68);if(more){if(EX.length<5)EX.push(d)}else IMG=d}catch(e){toast('Could not read a photo')}}thumbs()}
function prodForm(id){const p=MP.find(x=>x.id===id)||{};
 if(!id&&!SHOP.premium&&MP.length>=FREE_LIMIT)return sheet(`<h3>Free plan limit reached</h3><p class="mut" style="margin:10px 0">You can list ${FREE_LIMIT} products for free. Upgrade to Premium for unlimited products.</p><button class="btn" onclick="upgrade()">How to upgrade</button><button class="btn g" onclick="closeSh()">Close</button>`);
 IMG=p.img||'';EX=[...(p.imgs||[])];
 sheet(`<h3>${id?'Edit':'New'} product</h3>
 <label>Main photo</label><div class="thumbs" id="pv"></div>
 <label>More photos (up to 5: other angles, how it looks when worn)</label><div class="thumbs" id="pe"></div>
 <label>Name</label><input id="pN" value="${esc(p.name)}">
 <div class="row2"><div><label>Price (GH₵)</label><input id="pP" type="number" inputmode="decimal" value="${p.price??''}"></div><div><label>Old price (sale)</label><input id="pO" type="number" inputmode="decimal" value="${p.old||''}"></div></div>
 <label>📦 Quantity in stock (how many do you have?)</label><input id="pQ" type="number" inputmode="numeric" min="0" value="${p.qty??''}" placeholder="e.g. 20 (leave empty for no limit)">
 <label>Category</label><input id="pC" value="${esc(p.cat)}" placeholder="Dresses, Shoes…">
 <label>Description</label><textarea id="pD" rows="3">${esc(p.desc)}</textarea>
 <label>What's in the package (one item per line)</label><textarea id="pK" rows="3" placeholder="1 dress&#10;1 belt&#10;1 gift bag">${esc(p.pack)}</textarea>
 <button class="btn" onclick="saveProd('${id||''}')">Save product</button>${id?`<button class="btn r" onclick="delProd('${id}')">Delete</button>`:''}<button class="btn g" onclick="closeSh()">Cancel</button>`);thumbs()}
async function saveProd(id){const name=$('#pN').value.trim(),price=parseFloat($('#pP').value);if(!name||isNaN(price)||price<0)return toast('Add a name and a price');
 const qv=$('#pQ').value.trim(),d={name,price,old:parseFloat($('#pO').value)||0,qty:qv===''?null:Math.max(0,parseInt(qv)||0),cat:$('#pC').value.trim(),desc:$('#pD').value.trim(),pack:$('#pK').value.trim(),img:IMG,imgs:EX};
 const c=db.collection('shops').doc(SHOP.id).collection('products');
 try{id?await c.doc(id).update(d):await c.add({...d,stock:true,created:Date.now()});closeSh();toast('Saved ✅')}catch(e){toast('Save failed: '+e.code)}}
async function delProd(id){if(!confirm('Delete this product?'))return;await db.collection('shops').doc(SHOP.id).collection('products').doc(id).delete();closeSh()}
function upgrade(){sheet(`<h3>Premium</h3><p class="mut" style="margin:10px 0;line-height:1.7">Unlimited products, no "Powered by" tag. Pay by MoMo and send your shop link <b>${esc(link())}</b> to ${esc(SUPPORT_EMAIL)}. We'll switch it on.</p><button class="btn g" onclick="closeSh()">Close</button>`)}

const fN=n=>n>=1000?(n/1000).toFixed(1)+'k':n;
function svgBars(v,lab,id){const W=320,H=140,m=14,bw=(W-m*2)/v.length,mx=Math.max(1,...v);
 return `<svg viewBox="0 0 ${W} ${H+24}" width="100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac)" stop-opacity=".3"/></linearGradient></defs>`+v.map((x,i)=>{const h=Math.max(x/mx*(H-26),3),cx=m+i*bw+bw/2;return `<rect x="${cx-bw/2+7}" y="${H-h}" width="${bw-14}" height="${h}" rx="7" fill="url(#${id})"/><text x="${cx}" y="${H-h-6}" font-size="10" fill="var(--tx)" text-anchor="middle">${x?fN(x):''}</text><text x="${cx}" y="${H+16}" font-size="10" fill="var(--mut)" text-anchor="middle">${lab[i]}</text>`}).join('')+'</svg>'}
function donut(parts){const t=parts.reduce((a,x)=>a+x.v,0),R=46,C=2*Math.PI*R;let o=0;return `<svg viewBox="0 0 120 120" width="120"><circle r="${R}" cx="60" cy="60" fill="none" stroke="#272e47" stroke-width="16"/>`+(t?parts.map(x=>{const l=x.v/t*C,e=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return e}).join(''):'')+`<text x="60" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">${t}</text></svg>`}
function dStats(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d}),cnt=days.map(()=>0),rev=days.map(()=>0);
 MO.forEach(o=>{const k=days.findIndex(d=>d.toDateString()===new Date(o.created).toDateString());if(k>=0){cnt[k]++;rev[k]+=+o.total||0}});
 const lab=days.map(d=>d.toLocaleDateString('en',{weekday:'short'}).slice(0,3)),done=MO.filter(o=>o.status==='done').length,nw=MO.length-done,tp={};
 MO.forEach(o=>(o.items||[]).forEach(i=>tp[i.n]=(tp[i.n]||0)+i.q));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1,conv=SHOP.visits?Math.round(MO.length/SHOP.visits*100):0;
 $('#dBody').innerHTML=`<h3>Shop stats</h3><div class="stats"><div><b>${cnt[6]}</b>Orders today</div><div><b>${money(rev.reduce((a,b)=>a+b,0))}</b>Orders value (7 days)</div><div><b>${SHOP.visits||0}</b>Shop visits</div><div><b>${conv}%</b>Visits that ordered</div></div>
 <div class="card"><b>Orders per day</b>${svgBars(cnt,lab,'ga')}</div>
 <div class="card"><b>Order value per day (GH₵)</b>${svgBars(rev.map(Math.round),lab,'gb')}</div>
 <div class="card"><b>Order status</b><div style="display:flex;align-items:center;gap:20px;margin-top:8px">${donut([{v:nw,c:'#f2b705'},{v:done,c:'#3aa55d'}])}<div class="mut" style="line-height:2">🟡 New: ${nw}<br>🟢 Done: ${done}</div></div></div>
 <div class="card"><b>Best sellers</b>${top.length?top.map(([n,q])=>`<div style="margin:12px 0"><div class="top" style="margin:0 0 5px"><span>${esc(n)}</span><b>${q}</b></div><div style="height:8px;background:#272e47;border-radius:6px"><div style="height:8px;width:${q/mx*100}%;background:var(--ac);border-radius:6px"></div></div></div>`).join(''):'<p class="mut" style="margin-top:8px">No sales yet. Share your link to get orders.</p>'}</div><p class="mut" style="text-align:center">Based on your latest 100 orders.</p>`}
let OF='new';
const chN={wa:'WhatsApp',tg:'Telegram',ig:'Instagram',fb:'Facebook'};
function dOrd(){const l=MO.filter(o=>OF==='all'||(OF==='done')===(o.status==='done'));
 $('#dBody').innerHTML=`<h3>Orders</h3><div class="chips">${[['new','New'],['done','Done'],['all','All']].map(x=>`<button class="chip ${OF===x[0]?'on':''}" onclick="OF='${x[0]}';dOrd()">${x[1]}</button>`).join('')}</div>`+(l.length?l.map(o=>`<div class="card"><div class="top" style="margin:0"><b>${esc(o.name)}</b><b style="color:var(--ac)">${money(o.total)}</b></div><p class="mut">${(o.items||[]).map(i=>`${i.q}× ${esc(i.n)}`).join(', ')}</p><p class="mut">📍 ${esc(o.addr)}${o.phone?' · 📞 '+esc(o.phone):''}</p>${o.note?`<p class="mut">📝 ${esc(o.note)}</p>`:''}<p class="mut">${o.pay==='momo'?'💳 Pay now: '+esc(o.net||'MoMo')+(o.ref?' · Ref: '+esc(o.ref):''):'💵 Pay on delivery'}${o.ch?' · via '+(chN[o.ch]||''):''}</p><p class="mut">${new Date(o.created).toLocaleString()}</p>
 <div class="row2" style="margin-top:8px"><button class="btn g s" onclick="setOrd('${o.id}','${o.status==='done'?'new':'done'}')">${o.status==='done'?'✓ Done (undo)':'Mark done'}</button>${o.phone?`<button class="btn s" onclick="window.open('https://wa.me/${waNum(o.phone)}','_blank')">Message</button>`:''}<button class="btn r s" onclick="delOrd('${o.id}')">Delete</button></div></div>`).join(''):'<div class="card mut" style="text-align:center">No orders here yet.</div>')}
const setOrd=(id,s)=>db.collection('shops').doc(SHOP.id).collection('orders').doc(id).update({status:s});
const delOrd=id=>confirm('Delete this order?')&&db.collection('shops').doc(SHOP.id).collection('orders').doc(id).delete();

/* ---- PROMO ---- */
const toLocal=ms=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
function dPromo(){const m=SHOP.promo||{};
 $('#dBody').innerHTML=`<h3>Sales promo</h3><p class="mut" style="margin-top:4px">Show a sale banner with a countdown at the top of your shop page.</p><div class="card">
 <label class="ag"><input type="checkbox" id="mOn" ${m.on?'checked':''}><span>Promo is live on my shop</span></label>
 <label>Promo title</label><input id="mT" value="${esc(m.title)}" placeholder="e.g. Black Friday Sale">
 <label>Message</label><textarea id="mX" rows="2" placeholder="e.g. Free delivery on orders above GH₵200">${esc(m.text)}</textarea>
 <label>Discount on ALL products in % (optional)</label><input id="mP" type="number" inputmode="numeric" min="0" max="90" value="${m.pct||''}" placeholder="e.g. 15">
 <label>Promo ends (optional)</label><input id="mE" type="datetime-local" value="${m.end?toLocal(m.end):''}">
 <p class="mut" style="margin-top:8px">No discount % = only the banner shows, plus any product where you set an old price. When the end time passes, the promo switches off by itself.</p>
 <button class="btn" onclick="savePromo()">Save promo</button><button class="btn g" onclick="window.open(link(),'_blank')">Preview my shop</button></div>`}
async function savePromo(){const on=$('#mOn').checked,title=$('#mT').value.trim(),pct=Math.min(90,Math.max(0,parseInt($('#mP').value)||0)),ev=$('#mE').value,end=ev?new Date(ev).getTime():0;
 if(on&&!title)return toast('Give your promo a title');
 if(on&&end&&end<Date.now())return toast('End time is in the past');
 try{await db.collection('shops').doc(SHOP.id).update({promo:{on,title,text:$('#mX').value.trim(),pct,end}});toast(on?'Promo is live 🎉':'Promo saved (off)')}catch(e){toast('Save failed')}}

let LOGO='';
function dShop(){LOGO=SHOP.logo||'';$('#dBody').innerHTML=`<h3>Shop settings</h3><div class="card">
 <div class="pr"><div class="lg" id="lp" style="width:64px;height:64px">${logoHTML(SHOP)}</div><label class="btn g s" style="margin:0">Change logo<input type="file" accept="image/*" hidden onchange="pickLogo(this)"></label></div>
 <label>Shop name</label><input id="eN" value="${esc(SHOP.name)}"><label>WhatsApp number</label><input id="eW" type="tel" value="${esc(SHOP.whatsapp)}">
 <label>About</label><textarea id="eA" rows="2">${esc(SHOP.about)}</textarea><label>Location</label><input id="eLoc" value="${esc(SHOP.location)}" placeholder="e.g. Kumasi, Adum"><label>Delivery info</label><input id="eD" value="${esc(SHOP.delivery)}" placeholder="e.g. Delivery GH₵10 in town, 1-2 days"><label>Brand colour</label><input id="eC" type="color" value="${SHOP.color||'#f2b705'}" style="height:48px;padding:4px">
 <label class="ag"><input type="checkbox" id="eL" ${SHOP.listed!==false?'checked':''}><span>Show my shop on the Browse shops page</span></label></div>
 <div class="card"><b>💬 Order channels</b><p class="mut">Customers choose where to send their order. WhatsApp is always on. Fill the others only if you have them.</p>
 <label>Telegram username</label><input id="eT" value="${esc(SHOP.tg)}" placeholder="@yourname">
 <label>Instagram username</label><input id="eI" value="${esc(SHOP.ig)}" placeholder="@yourshop">
 <label>Facebook page / username</label><input id="eF" value="${esc(SHOP.fb)}" placeholder="yourpage"></div>
 <div class="card"><b>💳 Payments</b><p class="mut">Customers pick at checkout. Leave a number empty to hide that network.</p>
 <label class="ag"><input type="checkbox" id="eCod" ${SHOP.cod!==false?'checked':''}><span>Allow pay on delivery</span></label>
 <label>MTN MoMo number</label><input id="eM" type="tel" value="${esc(SHOP.mtn||SHOP.momo)}" placeholder="024…">
 <label>Telecel Cash number</label><input id="eTc" type="tel" value="${esc(SHOP.tcl)}" placeholder="020…">
 <label>AirtelTigo (AT Money) number</label><input id="eAt" type="tel" value="${esc(SHOP.atg)}" placeholder="026…">
 <label>MoMo account name</label><input id="eMn" value="${esc(SHOP.momoName)}" placeholder="Name on the MoMo account"></div>
 <button class="btn" onclick="saveShop()">Save changes</button>
 <button class="btn g" onclick="location.hash='#terms'">Terms of Use</button><button class="btn g" onclick="location.hash='#privacy'">Privacy Policy</button>
 <button class="btn r" onclick="delAccount()">Delete my shop and account</button>`}
async function pickLogo(i){if(!i.files[0])return;LOGO=await compress(i.files[0],200,.8);$('#lp').innerHTML=`<img src="${LOGO}">`}
async function saveShop(){const n=$('#eN').value.trim(),w=$('#eW').value.replace(/\D/g,'');if(!n||w.length<9)return toast('Check your name and WhatsApp number');
 try{await db.collection('shops').doc(SHOP.id).update({name:n,whatsapp:waNum(w),about:$('#eA').value.trim(),color:$('#eC').value,logo:LOGO,listed:$('#eL').checked,location:$('#eLoc').value.trim(),delivery:$('#eD').value.trim(),tg:hd($('#eT').value),ig:hd($('#eI').value),fb:hd($('#eF').value),cod:$('#eCod').checked,mtn:$('#eM').value.trim(),tcl:$('#eTc').value.trim(),atg:$('#eAt').value.trim(),momoName:$('#eMn').value.trim(),momo:''});applyColor($('#eC').value);toast('Saved ✅')}catch(e){toast('Save failed')}}
async function delAccount(){if(!confirm('This deletes your shop, products and orders for good. Continue?'))return;
 try{const r=db.collection('shops').doc(SHOP.id);for(const c of['products','orders']){const s=await r.collection(c).get();await Promise.all(s.docs.map(d=>d.ref.delete()))}await r.delete();await user.delete();toast('Account deleted')}catch(e){toast(e.code==='auth/requires-recent-login'?'Log out, log in again, then retry.':'Could not delete')}}

function dShare(){const l=link(),m=encodeURIComponent(`Shop with ${SHOP.name} 🛍️ Browse and order here: ${l}`);
 $('#dBody').innerHTML=`<h3>Share your shop</h3><div class="card"><p class="mut">Your shop link</p><b style="word-break:break-all;color:var(--ac)">${esc(l)}</b>
 <button class="btn" onclick="navigator.clipboard.writeText('${l}').then(()=>toast('Link copied'))">Copy link</button>
 <button class="btn g" onclick="window.open('https://wa.me/?text=${m}')">Share on WhatsApp</button>
 <button class="btn g" onclick="window.open('${l}','_blank')">Preview my shop</button></div>
 <div class="card"><p class="mut" style="text-align:center">QR code for flyers and your counter</p><div id="qr"></div></div>
 <button class="btn" onclick="install()">📲 Install this app</button>`;
 try{new QRCode($('#qr'),{text:l,width:180,height:180})}catch(e){$('#qr').textContent='QR unavailable offline'}}

/* ---------- SEO + BROWSE ---------- */
function meta(k,c){let m=document.querySelector(`meta[name="${k}"],meta[property="${k}"]`);if(!m){m=document.createElement('meta');m.setAttribute(k.startsWith('og:')?'property':'name',k);document.head.append(m)}m.content=c}
function seo(s){const t=s.name+' | Order on WhatsApp',d=(s.about||`Browse ${s.name} and order on WhatsApp.`).slice(0,155),u=shopUrl(s.id);
 document.title=t;meta('description',d);meta('og:title',t);meta('og:description',d);meta('og:url',u);meta('og:type','website');meta('robots','index,follow');
 let c=document.querySelector('link[rel=canonical]');if(!c){c=document.createElement('link');c.rel='canonical';document.head.append(c)}c.href=u;
 const j=document.createElement('script');j.type='application/ld+json';j.text=JSON.stringify({'@context':'https://schema.org','@type':'Store',name:s.name,description:d,url:u});document.head.append(j)}
async function loadShops(){view('shops');document.title='Browse shops | '+APP_NAME;const b=$('#shGrid');b.innerHTML='<p class="mut">Loading shops…</p>';
 try{const q=await db.collection('shops').where('listed','==',true).limit(60).get();
  b.innerHTML=q.docs.length?q.docs.map(d=>{const x=d.data();return `<a class="card pr" href="${shopUrl(d.id)}" style="text-decoration:none;color:inherit;border-bottom:1px solid var(--line)"><div class="lg" style="width:56px;height:56px">${logoHTML(x)}</div><div class="i"><b>${esc(x.name)}</b><span class="mut">${esc((x.about||'').slice(0,70))}</span></div></a>`}).join(''):'<p class="mut">No shops listed yet.</p>'}
 catch(e){b.innerHTML='<p class="mut">Could not load shops. Check your connection.</p>'}}

</script>
